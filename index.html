<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тест на скуку</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #ffd6e7 0, transparent 35%),
        radial-gradient(circle at 80% 70%, #c9e7ff 0, transparent 35%),
        #f7f7fb;
      color: #20222a;
    }

    .card {
      width: min(92vw, 560px);
      padding: 42px 30px;
      border-radius: 28px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 20px 70px rgba(40, 45, 70, .15);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 6vw, 48px);
    }

    p {
      margin: 0 0 30px;
      color: #6d7080;
      font-size: 17px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 130px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      touch-action: manipulation;
    }

    #yesBtn {
      min-width: 190px;
      background: #20222a;
      color: white;
      box-shadow: 0 10px 25px rgba(32, 34, 42, .22);
      position: relative;
      z-index: 2;
    }

    #yesBtn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    #noBtn {
      min-width: 220px;
      background: white;
      color: #20222a;
      border: 2px solid #e7e7ee;
      position: relative;
      z-index: 3;
    }

    /* Только после первой попытки нажать "Нет" кнопка начинает бегать */
    #noBtn.running {
      position: fixed;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .challenge {
      margin-top: 25px;
      padding: 22px;
      border-radius: 20px;
      background: #f5f5fa;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 700;
    }

    #newTask {
      margin-top: 18px;
      background: #ff5e8a;
      color: white;
    }

    .small {
      margin-top: 14px;
      font-size: 13px;
      color: #999baa;
    }
  </style>
</head>

<body>

  <main class="card">
    <section id="questionScreen">
      <h1>Катя, тебе скучно на работе? 👀</h1>
      <p>Только отвечай честно. Это очень серьёзное исследование.</p>

      <div class="buttons">
        <button id="yesBtn">Да 😭</button>
        <button id="noBtn">Нет, я работаю 😇</button>
      </div>
    </section>

    <section id="funScreen" class="hidden">
      <h1>Отлично 😈</h1>
      <p>Значит, официально разрешаю тебе отвлечься на минуту.</p>

      <div class="challenge" id="challenge">
        Нажми кнопку и получи абсолютно бесполезное задание.
      </div>

      <button id="newTask">Дай мне задание</button>

      <div class="small">
        Работодатель об этом сайте ничего не знает.
      </div>
    </section>
  </main>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionScreen = document.getElementById('questionScreen');
    const funScreen = document.getElementById('funScreen');
    const challenge = document.getElementById('challenge');
    const newTask = document.getElementById('newTask');

    const tasks = [
      'Посмотри на самого занятого человека в офисе и загадочно кивни.',
      'Открой калькулятор и введи 5318008. Ты знаешь, что делать дальше.',
      'Сделай вид, что срочно что-то вспомнила. Через 10 секунд забудь.',
      'Попробуй ровно минуту не открывать ни один рабочий чат.',
      'Найди вокруг себя 5 предметов одного цвета.',
      'Придумай своему начальнику имя супергероя.',
      'Напиши другу: «Всё идёт по плану». Ничего больше не объясняй.',
      'Выпей воды так, будто это очень важная бизнес-задача.',
      'Поставь таймер на 30 секунд и просто смотри в окно.',
      'Оцени сегодняшний рабочий день по шкале от «ну ладно» до «спасите».'
    ];

    function moveNoButton() {
      if (!noBtn.classList.contains('running')) {
        const rect = noBtn.getBoundingClientRect();

        // Сохраняем текущее положение, чтобы первый прыжок не выглядел резко
        noBtn.classList.add('running');
        noBtn.style.left = rect.left + 'px';
        noBtn.style.top = rect.top + 'px';
      }

      const padding = 18;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const maxX = Math.max(padding, window.innerWidth - btnWidth - padding);
      const maxY = Math.max(padding, window.innerHeight - btnHeight - padding);

      let x;
      let y;
      let attempts = 0;

      // Стараемся не ставить "Нет" поверх кнопки "Да"
      const yesRect = yesBtn.getBoundingClientRect();

      do {
        x = padding + Math.random() * Math.max(0, maxX - padding);
        y = padding + Math.random() * Math.max(0, maxY - padding);
        attempts++;

        const overlapsYes =
          x < yesRect.right + 20 &&
          x + btnWidth > yesRect.left - 20 &&
          y < yesRect.bottom + 20 &&
          y + btnHeight > yesRect.top - 20;

        if (!overlapsYes || attempts > 20) break;
      } while (true);

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseenter', moveNoButton);

    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    noBtn.addEventListener('click', (event) => {
      event.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      questionScreen.classList.add('hidden');
      funScreen.classList.remove('hidden');
      noBtn.classList.add('hidden');
    });

    newTask.addEventListener('click', () => {
      const task = tasks[Math.floor(Math.random() * tasks.length)];
      challenge.textContent = task;
    });
  </script>

</body>
</html>
